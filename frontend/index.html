<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÇITIR Tavuk &amp; Cafe — Çıtır Lezzetler, Sıcak Servis</title>
    <meta name="description" content="ÇITIR Tavuk & Cafe — Gizli baharat karışımı, taze malzeme ve özel kaplama tekniğiyle hazırlanan kıtır tavuklar." />
    <link rel="icon" id="favicon" href="/favicon.ico" />
    <script>
      // Dinamik favicon: settings'ten yüklendiğinde override eder
      (async () => {
        try {
          const r = await fetch((import.meta?.env?.VITE_API_URL || 'http://localhost:8000/api') + '/settings');
          const d = await r.json();
          const f = d?.data?.site_favicon;
          if (f) {
            const base = (import.meta?.env?.VITE_API_URL || 'http://localhost:8000/api').replace(/\/api\/?$/, '');
            const url = /^https?:/.test(f) ? f : `${base}/storage/${f.replace(/^\/+/, '')}`;
            document.getElementById('favicon').href = url;
          }
        } catch {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
